name: thelemartools-hub

services:
  db:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub_owner
      POSTGRES_PASSWORD: ${HUB_POSTGRES_PASSWORD:?Set HUB_POSTGRES_PASSWORD}
      HUB_RUNTIME_DB_PASSWORD: ${HUB_RUNTIME_DB_PASSWORD:?Set HUB_RUNTIME_DB_PASSWORD}
      HUB_BACKUP_DB_PASSWORD: ${HUB_BACKUP_DB_PASSWORD:?Set HUB_BACKUP_DB_PASSWORD}
      HUB_OPERATIONS_DB_PASSWORD: ${HUB_OPERATIONS_DB_PASSWORD:?Set HUB_OPERATIONS_DB_PASSWORD}
    volumes:
      - hub-postgres:/var/lib/postgresql/data
      - ./deploy/hub/init-roles.sh:/docker-entrypoint-initdb.d/10-hub-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hub_owner -d hub"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
    networks: [hub-private]

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        VERSION: ${HUB_IMAGE_VERSION:-dev}
        VCS_REF: ${HUB_VCS_REF:-local}
        NPM_REGISTRY: ${HUB_NPM_REGISTRY:-https://registry.npmjs.org/}
    command: ["npm", "run", "hub:migrate"]
    environment:
      DATABASE_URL: postgresql://hub_owner:${HUB_POSTGRES_PASSWORD}@db:5432/hub
      HUB_DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [hub-private]

  grant-roles:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        VERSION: ${HUB_IMAGE_VERSION:-dev}
        VCS_REF: ${HUB_VCS_REF:-local}
        NPM_REGISTRY: ${HUB_NPM_REGISTRY:-https://registry.npmjs.org/}
    command: ["npm", "run", "hub:grant-roles"]
    environment:
      DATABASE_URL: postgresql://hub_owner:${HUB_POSTGRES_PASSWORD}@db:5432/hub
      HUB_DATABASE_SSL: "false"
      HUB_RUNTIME_DB_ROLE: hub_runtime
      HUB_RUNTIME_DB_PASSWORD: ${HUB_RUNTIME_DB_PASSWORD:?Set HUB_RUNTIME_DB_PASSWORD}
      HUB_BACKUP_DB_ROLE: hub_backup
      HUB_BACKUP_DB_PASSWORD: ${HUB_BACKUP_DB_PASSWORD:?Set HUB_BACKUP_DB_PASSWORD}
      HUB_OPERATIONS_DB_ROLE: hub_operations
      HUB_OPERATIONS_DB_PASSWORD: ${HUB_OPERATIONS_DB_PASSWORD:?Set HUB_OPERATIONS_DB_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks: [hub-private]

  bff:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        VERSION: ${HUB_IMAGE_VERSION:-dev}
        VCS_REF: ${HUB_VCS_REF:-local}
        NPM_REGISTRY: ${HUB_NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      HUB_APP_ORIGIN: ${HUB_APP_ORIGIN:-https://localhost:8443}
      HUB_HOST: 0.0.0.0
      HUB_PORT: 5052
      HUB_COOKIE_SECRET: ${HUB_COOKIE_SECRET:?Set HUB_COOKIE_SECRET}
      HUB_CSRF_SECRET: ${HUB_CSRF_SECRET:?Set HUB_CSRF_SECRET}
      HUB_METRICS_TOKEN: ${HUB_METRICS_TOKEN:?Set HUB_METRICS_TOKEN}
      HUB_LOG_LEVEL: ${HUB_LOG_LEVEL:-info}
      DATABASE_URL: postgresql://hub_runtime:${HUB_RUNTIME_DB_PASSWORD}@db:5432/hub
      HUB_DATABASE_SSL: "false"
      HUB_TRUST_PROXY: ${HUB_TRUST_PROXY:-172.30.0.10}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET}
      HUB_ALLOWED_OAUTH_SUBJECTS: ${HUB_ALLOWED_OAUTH_SUBJECTS:?Set HUB_ALLOWED_OAUTH_SUBJECTS}
    depends_on:
      grant-roles:
        condition: service_completed_successfully
    networks:
      - hub-private
      - hub-egress

  static:
    build:
      context: .
      dockerfile: deploy/hub/static.Dockerfile
    restart: unless-stopped
    networks: [hub-private]

  edge:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./deploy/hub/Caddyfile:/etc/caddy/Caddyfile:ro
      - hub-caddy-data:/data
      - hub-caddy-config:/config
    depends_on:
      bff:
        condition: service_healthy
      static:
        condition: service_started
    networks:
      hub-private:
        ipv4_address: 172.30.0.10
      hub-public:

  maintenance:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        VERSION: ${HUB_IMAGE_VERSION:-dev}
        VCS_REF: ${HUB_VCS_REF:-local}
        NPM_REGISTRY: ${HUB_NPM_REGISTRY:-https://registry.npmjs.org/}
    command: ["npm", "run", "hub:maintenance"]
    environment:
      DATABASE_URL: postgresql://hub_runtime:${HUB_RUNTIME_DB_PASSWORD}@db:5432/hub
      HUB_DATABASE_SSL: "false"
      HUB_MAINTENANCE_BATCH_SIZE: ${HUB_MAINTENANCE_BATCH_SIZE:-1000}
    depends_on:
      grant-roles:
        condition: service_completed_successfully
    restart: "no"
    networks: [hub-private]

  backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: server/ops.Dockerfile
      args:
        VERSION: ${HUB_IMAGE_VERSION:-dev}
        VCS_REF: ${HUB_VCS_REF:-local}
    command:
      - sh
      - -ec
      - node server/scripts/backup-encrypted.mjs "/backups/hub-$$(date -u +%Y%m%dT%H%M%SZ).dump.enc"
    environment:
      DATABASE_URL: postgresql://hub_backup:${HUB_BACKUP_DB_PASSWORD}@db:5432/hub
      HUB_OPERATIONS_DATABASE_URL: postgresql://hub_operations:${HUB_OPERATIONS_DB_PASSWORD}@db:5432/hub
      HUB_BACKUP_ENCRYPTION_KEY: ${HUB_BACKUP_ENCRYPTION_KEY:?Set HUB_BACKUP_ENCRYPTION_KEY}
    volumes:
      - hub-backups:/backups
    depends_on:
      grant-roles:
        condition: service_completed_successfully
    restart: "no"
    networks: [hub-private]

volumes:
  hub-postgres:
  hub-caddy-data:
  hub-caddy-config:
  hub-backups:

networks:
  hub-private:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  hub-public:
  hub-egress:
